name: CI

# Runs on every PR into main (and on main itself after merge) so the
# lint + test + build status is available as a required check before merging.
# A version tag (v1.2.3) also publishes the Chrome extension as a GitHub release.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# A new push to a PR cancels the previous, still-running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The release must ship the version it is tagged with
      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `npm run build` is `tsc -b && vite build`, so this type-checks too.
      - name: Build
        run: npm run build

      # Manifest version comes from package.json
      - name: Build Chrome extension
        run: npx vite build --mode extension

      - name: Package Chrome extension
        run: cd dist-extension && zip -r ../expression-flow-extension.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: expression-flow-extension
          path: expression-flow-extension.zip
          if-no-files-found: error

  # A version tag creates the release. A push to main refreshes the notes of
  # the release that matches package.json, if that release exists.
  release:
    name: Publish release
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the release
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "action=create" >> "$GITHUB_OUTPUT"
          else
            tag="v$(node -p "require('./package.json').version")"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "action=edit" >> "$GITHUB_OUTPUT"
            else
              echo "action=none" >> "$GITHUB_OUTPUT"
            fi
          fi

      # .github/release-notes/<tag>.md (features, pictures) goes above the
      # generated list of changes. {{TAG}} and {{REPO}} are filled in.
      - name: Write release notes
        if: steps.release.outputs.action != 'none'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          template=".github/release-notes/$TAG.md"
          : > notes.md
          if [ -f "$template" ]; then
            sed -e "s#{{TAG}}#$TAG#g" -e "s#{{REPO}}#$GH_REPO#g" "$template" >> notes.md
            echo >> notes.md
          fi
          gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body >> notes.md

      - uses: actions/download-artifact@v4
        if: steps.release.outputs.action == 'create'
        with:
          name: expression-flow-extension

      - name: Create release
        if: steps.release.outputs.action == 'create'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" expression-flow-extension.zip \
            --verify-tag \
            --title "Expression Flow $TAG" \
            --notes-file notes.md

      - name: Update release notes
        if: steps.release.outputs.action == 'edit'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$TAG" --notes-file notes.md
